<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - ONG</title>
    <link rel="stylesheet" href="css/cadastros.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecalho">

        <a href="index.html" class="logo">
            <img width="200" src="img/logo.jpg" alt="Logo da ONG">
        </a>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon" aria-label="Abrir menu">
            ☰
        </label>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Seja Voluntário</a>
            <a href="index.html#contato">Contato</a>
        </nav>

    </header>

    <main>

        <section class="formulario">
            <h1>Seja um Voluntário</h1>

            <p>
                Preencha o formulário abaixo para fazer parte da nossa rede
                de voluntários.
            </p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3"
                        placeholder="Digite seu nome completo">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        placeholder="000.000.000-00">

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                        placeholder="(34) 99999-9999">

                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>

                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required placeholder="Rua, número e complemento">

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required placeholder="Digite sua cidade">

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="GO">Goiás</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="BA">Bahia</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="PR">Paraná</option>
                    </select>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000">

                </fieldset>

                <fieldset>
                    <legend>Interesse em participar</legend>

                    <label for="area">Área de interesse:</label>

                    <select id="area" name="area" required>
                        <option value="">Selecione uma opção</option>
                        <option value="educacao">Educação</option>
                        <option value="arrecadacao">Arrecadação</option>
                        <option value="eventos">Eventos</option>
                        <option value="comunicacao">Comunicação</option>
                        <option value="outros">Outros</option>
                    </select>

                    <label for="mensagem">Por que deseja ser voluntário?</label>

                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Conte um pouco sobre seu interesse..."
                        required></textarea>

                </fieldset>

                <div class="acoes">
                    <button type="submit" class="botao">
                        Enviar cadastro
                    </button>

                    <button type="reset" class="botao botao-secundario">
                        Limpar
                    </button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ONG - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
