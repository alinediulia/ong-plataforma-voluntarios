# =========================================================
# DEPLOY NO GITHUB PAGES
# A cada push na branch main (ou seja, a cada release do
# GitFlow), roda os testes, gera a build e publica a pasta dist/.
# =========================================================

name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# não publica duas versões ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Gerar a build de produção
        run: npm run build

      - name: Enviar a pasta dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
